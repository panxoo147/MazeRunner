<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Maze Race — แข่งออกเขาวงกต</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236c5ce7'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="panel home-panel">
      <h1>🌀 Maze Race</h1>
      <p class="subtitle">แข่งออกจากเขาวงกตให้เร็วที่สุด — บังคับด้วยเมาส์หรือ WASD</p>

      <label class="field">
        <span>ชื่อของคุณ</span>
        <input id="input-name" type="text" maxlength="16" placeholder="เช่น Pan" autocomplete="off" />
      </label>

      <div class="field">
        <span>โหมดควบคุม</span>
        <div class="control-toggle" id="control-toggle">
          <button type="button" class="control-opt" data-mode="mouse">🖱️ เมาส์</button>
          <button type="button" class="control-opt" data-mode="wasd">⌨️ WASD</button>
          <button type="button" class="control-opt" data-mode="touch">📱 จอยสติ๊ก</button>
        </div>
        <span class="control-hint">สลับได้ระหว่างเล่นด้วยปุ่ม <kbd>M</kbd> หรือแตะปุ่มมุมจอ</span>
      </div>

      <div class="home-actions">
        <button id="btn-create" class="btn btn-primary">สร้างห้องใหม่</button>

        <div class="divider"><span>หรือ</span></div>

        <label class="field">
          <span>โค้ดเข้าห้อง</span>
          <input id="input-code" type="text" maxlength="5" placeholder="เช่น 7XJ2Q" autocomplete="off" />
        </label>
        <button id="btn-join" class="btn btn-secondary">เข้าร่วมห้อง</button>
      </div>

      <p id="home-error" class="error-text"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen">
    <div class="panel lobby-panel">
      <div class="lobby-header">
        <div>
          <div class="lobby-code-label">โค้ดห้อง</div>
          <div class="lobby-code" id="lobby-code">-----</div>
        </div>
        <button id="btn-copy-code" class="btn btn-small">คัดลอก</button>
      </div>

      <div class="lobby-sub">
        <span id="lobby-count">0</span> / <span id="lobby-max">50</span> ผู้เล่น
      </div>

      <div id="player-list" class="player-list"></div>

      <div class="lobby-footer">
        <button id="btn-start" class="btn btn-primary" style="display:none">เริ่มการแข่งขัน</button>
        <p id="lobby-wait-msg" class="wait-msg">รอโฮสต์เริ่มเกม...</p>
        <button id="btn-leave-lobby" class="btn btn-ghost">ออกจากห้อง</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <canvas id="game-canvas"></canvas>

    <div id="countdown-overlay" class="countdown-overlay hidden">
      <div id="countdown-number">5</div>
    </div>

    <div class="hud hud-top-left">
      <div class="hud-timer" id="hud-timer">00:00.0</div>
      <div class="hud-status" id="hud-status">พร้อมลุย!</div>
      <button id="hud-control-toggle" class="hud-control-btn" title="สลับโหมดควบคุม (M)">🖱️ เมาส์</button>
    </div>

    <div class="hud hud-top-right">
      <div class="hud-title">อันดับ</div>
      <ol id="hud-leaderboard" class="hud-leaderboard"></ol>
    </div>

    <canvas id="minimap-canvas" class="minimap"></canvas>

    <div id="joystick-base" class="joystick-base hidden">
      <div id="joystick-knob" class="joystick-knob"></div>
    </div>

    <div id="orientation-hint" class="orientation-hint">🔄 หมุนจอแนวนอนเพื่อเล่นง่ายขึ้น</div>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="screen">
    <div class="panel results-panel">
      <h2>🏁 ผลการแข่งขัน</h2>
      <ol id="results-list" class="results-list"></ol>
      <div class="results-footer">
        <button id="btn-play-again" class="btn btn-primary" style="display:none">แข่งใหม่อีกครั้ง</button>
        <p id="results-wait-msg" class="wait-msg" style="display:none">รอโฮสต์เริ่มรอบใหม่...</p>
        <button id="btn-leave-results" class="btn btn-ghost">ออกจากห้อง</button>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
